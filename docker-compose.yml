services:
  db:
    image: pgvector/pgvector:pg16
    container_name: photo-manager-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-photo_manager}
      POSTGRES_USER: ${POSTGRES_USER:-photo_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-photo_manager}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/db:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-photo_manager} -d ${POSTGRES_DB:-photo_manager}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: photo-manager-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  api:
    build:
      context: ./backend
    container_name: photo-manager-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-photo_manager}:${POSTGRES_PASSWORD:-photo_manager}@db:5432/${POSTGRES_DB:-photo_manager}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      REDIS_URL: redis://redis:6379/0
      AI_CACHE_DIR: /cache/ai
      MEDIA_ORIGINALS_DIR: /media/originals
      MEDIA_PROCESSED_DIR: /media/processed
      TRUSTED_PROXY_HEADERS: "true"
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--proxy-headers",
        "--forwarded-allow-ips=*"
      ]
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./data/ai_cache:/cache/ai
      - ./storage/originals:/media/originals
      - ./storage/processed:/media/processed

  worker-fast:
    build:
      context: ./backend
    container_name: photo-manager-worker-fast
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-photo_manager}:${POSTGRES_PASSWORD:-photo_manager}@db:5432/${POSTGRES_DB:-photo_manager}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      REDIS_URL: redis://redis:6379/0
      AI_CACHE_DIR: /cache/ai
      MEDIA_ORIGINALS_DIR: /media/originals
      MEDIA_PROCESSED_DIR: /media/processed
      WORKER_QUEUES: interactive,metadata,preview
      WORKER_MAX_JOBS: ${WORKER_FAST_MAX_JOBS:-2}
      WORKER_TOTAL_CONCURRENCY: ${WORKER_FAST_TOTAL_CONCURRENCY:-2}
      WORKER_PREVIEW_CONCURRENCY: ${WORKER_FAST_PREVIEW_CONCURRENCY:-1}
      WORKER_VIDEO_PREVIEW_CONCURRENCY: ${WORKER_FAST_VIDEO_PREVIEW_CONCURRENCY:-1}
      WORKER_CLIP_CONCURRENCY: 1
      WORKER_FACES_CONCURRENCY: 1
      WORKER_SCAN_CONCURRENCY: 1
      WORKER_FACE_CLUSTERING_CONCURRENCY: 1
      WORKER_MAINTENANCE_CONCURRENCY: 1
    command: ["python", "-m", "worker"]
    volumes:
      - ./backend:/app
      - ./data/ai_cache:/cache/ai
      - ./storage/originals:/media/originals:ro
      - ./storage/processed:/media/processed

  worker-batch:
    build:
      context: ./backend
    container_name: photo-manager-worker-batch
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-photo_manager}:${POSTGRES_PASSWORD:-photo_manager}@db:5432/${POSTGRES_DB:-photo_manager}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      REDIS_URL: redis://redis:6379/0
      AI_CACHE_DIR: /cache/ai
      MEDIA_ORIGINALS_DIR: /media/originals
      MEDIA_PROCESSED_DIR: /media/processed
      WORKER_QUEUES: ai,backfill,maintenance
      WORKER_MAX_JOBS: ${WORKER_BATCH_MAX_JOBS:-1}
      WORKER_TOTAL_CONCURRENCY: ${WORKER_BATCH_TOTAL_CONCURRENCY:-1}
      WORKER_PREVIEW_CONCURRENCY: 1
      WORKER_VIDEO_PREVIEW_CONCURRENCY: 1
      WORKER_CLIP_CONCURRENCY: 1
      WORKER_FACES_CONCURRENCY: 1
      WORKER_SCAN_CONCURRENCY: 1
      WORKER_FACE_CLUSTERING_CONCURRENCY: 1
      WORKER_MAINTENANCE_CONCURRENCY: 1
    command: ["python", "-m", "worker"]
    volumes:
      - ./backend:/app
      - ./data/ai_cache:/cache/ai
      - ./storage/originals:/media/originals:ro
      - ./storage/processed:/media/processed
